name: Frontend checks

on:
  pull_request:
  push:
    branches:
      - "**"

jobs:
  build:
    name: Typecheck and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Local server security regression
        run: npm run test:server

      - name: Dependency vulnerabilities
        run: npm run security:dependencies

  gate:
    name: CI Gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - build
    steps:
      - name: Require all frontend checks
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: test "$BUILD_RESULT" = "success"
